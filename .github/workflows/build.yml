name: Build firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m platformio run -e orb-clock
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: orbOfManyFaces-release
          path: releases/*
