name: Build firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installer-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-install.txt
      - run: python -m esptool version
      - run: python -m unittest discover -s tests -v
  build:
    needs: installer-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python tools/test_favorites.py
      - run: python tools/test_rotation.py
      - run: python tools/test_network_setup.py
      - run: python -m platformio run -e orb-clock
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: orbOfManyFaces-release
          path: releases/*
  windows-flasher:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-flasher-build.txt
      - uses: actions/download-artifact@v4
        with:
          name: orbOfManyFaces-release
          path: releases
      - shell: pwsh
        run: |
          $firmwareZip = Get-ChildItem -LiteralPath releases -Filter 'orbOfManyFaces-*.zip' | Select-Object -First 1
          Expand-Archive -LiteralPath $firmwareZip.FullName -DestinationPath .flasher-payload
          $firmwarePayload = Get-ChildItem -LiteralPath .flasher-payload -Directory | Select-Object -First 1
          python tools/build_windows_flasher.py --payload-dir $firmwarePayload.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: orbOfManyFaces-windows-flasher
          path: |
            releases/*Flasher*windows-x64.zip
            releases/*Flasher*windows-x64.zip.sha256
